<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>选区研究笔记</title></head><body>
<h1>选区研究笔记</h1><p>这是运行在隔离窗口中的第三方插件示例。先在编辑器选中文字，再读取选区。</p>
<button id="read">读取当前选区</button><pre id="selection">尚未读取</pre><p id="stats"></p>
<button id="propose" disabled>提交拼写修改建议</button><p>检测到 “teh” 时可提出修改，正文由作者在建议中心决定是否应用。</p>
<label for="note">我的研究笔记</label><textarea id="note" rows="4"></textarea><button id="save">保存笔记</button><p id="status" role="status"></p>
<script src="/extensions/sdk.js"></script><script src="plugin.js"></script></body></html>
