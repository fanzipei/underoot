<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文表格编辑器</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="katex.min.css"></head><body>
<header><div><strong>表格编辑器</strong><span>在网格中选中单元格，修改内容或样式</span></div><button id="save">保存回 TeX</button></header>
<nav><label>文件 <select id="files" aria-label="TeX 文件"></select></label><button id="open">重新读取 / 丢弃草稿</button><label>表格 <select id="tables" aria-label="文中的表格"></select></label><button id="new">新增表格</button></nav>
<p id="status" role="status">正在读取项目…</p>
<section class="toolbar" aria-label="表格样式"><label>线条样式 <select id="style" aria-label="线条样式"><option value="booktabs">三线表 · booktabs</option><option value="grid">完整网格</option><option value="plain">无边框</option></select></label><label>行距 <input id="stretch" aria-label="行距" type="number" min="0.8" max="2" step="0.1"></label><label>列间距(pt) <input id="padding" aria-label="列间距(pt)" type="number" min="2" max="16" step="1"></label><label>当前列对齐 <select id="align" aria-label="当前列对齐"><option value="l">左对齐</option><option value="c">居中</option><option value="r">右对齐</option></select></label><button id="bold">切换首行加粗</button></section>
<section class="workspace"><div class="canvas"><div id="grid" aria-label="可视化表格"></div><p id="packages"></p></div><aside><label id="cell-label" for="cell">单元格</label><textarea id="cell" rows="5" spellcheck="false" aria-label="单元格 TeX 内容"></textarea><small>直接保留 TeX（支持公式、引用及格式宏）。输入普通文本时可用下方按钮自动转义特殊字符。</small><button id="plain">将输入作为普通文本转义</button><div class="actions"><button id="add-row">下方插入行</button><button id="remove-row">删除当前行</button><button id="add-col">右侧插入列</button><button id="remove-col">删除当前列</button><button id="merge">与右侧单元格合并</button><button id="split">拆分合并列</button></div><p>含复杂跨行、嵌套或自定义规则的表格会保留源码，不强制转换。预览用于编辑，最终排版以项目编译的 PDF 为准。</p></aside></section>
<details><summary>TeX 预览 / 从编辑后的 TeX 重新载入</summary><textarea id="source" rows="11" spellcheck="false" aria-label="表格 TeX 源码"></textarea><button id="parse">从这份 TeX 更新网格</button><p>仅接受一个表格；更新网格后，保存只替换原表格所在区域。表外 caption、label、正文保持原样。</p></details>
<script src="/extensions/sdk.js"></script><script src="plugin.js"></script></body></html>
