<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 研究写作</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="katex.min.css"></head><body>
<header><b>Markdown · 实时研究写作</b><span id="status" role="status">加载中…</span></header>
<nav><select id="files" aria-label="项目文档"></select><button id="open">打开 / 丢弃草稿</button><button id="new">新建 Markdown</button><button id="save">保存到项目</button></nav>
<nav><input id="path" aria-label="文件路径" placeholder="notes.md"><button id="bold">粗体</button><button id="heading">标题</button><button id="convert">一键转为 TeX 新文件</button></nav>
<main><textarea id="source" spellcheck="false" aria-label="文档源码"></textarea><article id="preview" aria-label="实时预览"></article></main>
<footer>支持标题、列表、表格、代码和 $公式$。TeX 文件可在此转为 Markdown；原稿保留，复杂宏和排版可能有损。外部图片和原始 HTML 受安全限制。</footer>
<script src="/extensions/sdk.js"></script><script src="plugin.js"></script></body></html>
